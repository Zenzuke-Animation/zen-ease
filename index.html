<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Zen Ease</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/CSInterface.js"></script>
</head>
<body>
    <div class="tab-navigation">
        <button class="tab-btn active" id="tabBtnEditor">Curve Editor</button>
        <button class="tab-btn" id="tabBtnLibrary">Preset Library</button>
    </div>

    <div id="app">
        <!-- Editor View -->
        <div id="editorView" class="tab-content active">
            <canvas id="curveCanvas" width="280" height="280"></canvas>
            <div class="controls">
                <div class="info-row">
                    <input type="text" id="bezierInput" value="0.25, 0.10, 0.25, 1.00">
                    <button id="btnFlipCurve" title="Flip Curve">⇄</button>
                </div>
                <div class="button-row">
                    <button id="btnGet">Get from AE</button>
                    <button id="btnApply">Apply to AE</button>
                </div>
                <div class="preset-row">
                    <button id="btnOpenLibrary" class="library-trigger">
                        <span id="presetSelectValue">Select preset...</span>
                        <span class="lib-icon">📚</span>
                    </button>
                    <button id="btnSavePreset" title="Save Preset">+</button>
                </div>
            </div>
        </div>

        <!-- Presets Library View -->
        <div id="libraryView" class="tab-content">
            <div class="library-actions">
                <button id="btnImportPresets">Import Presets</button>
                <button id="btnExportPresets">Export Presets</button>
            </div>
            <div id="presetsList" class="presets-list-container">
                <!-- Dynamic cards populated by JS -->
            </div>
        </div>
    </div>
    
    <div id="promptModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p>Enter a name for this preset:</p>
            <input type="text" id="presetNameInput">
            <div class="modal-buttons">
                <button id="btnModalCancel">Cancel</button>
                <button id="btnModalOk">Save</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p id="confirmMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button id="btnConfirmCancel">No</button>
                <button id="btnConfirmOk">Yes</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
